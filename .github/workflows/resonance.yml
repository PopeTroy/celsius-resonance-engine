name: UESP 0.3s Apex CDN Swarm
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  execute_swarm:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Interdimensional Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Execute Apex Synthesis
        env:
          GROQ_KEY: ${{ secrets.GROQ_API_KEY }}
          NVIDIA_KEY: ${{ secrets.NVIDIA_API_KEY }}
          BRIDGE_URL: ${{ secrets.BRIDGE_URL }}
          BRIDGE_KEY: ${{ secrets.BRIDGE_KEY }}
        run: python scripts/init_swarm.py

      - name: Deploy to Global Edge (CDN)
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./cdn_assets
          publish_branch: ctmg-edge
