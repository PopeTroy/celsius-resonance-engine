name: UESP 0.3s Resonance Swarm
on:
  schedule:
    - cron: '*/30 * * * *' # Cycle 2: 30-min sync pulse
  workflow_dispatch:

jobs:
  execute_swarm:
    runs-on: ubuntu-latest
    steps:
      - name: Interdimensional Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Execute Cycles 1-7
        env:
          GROQ_KEY: ${{ secrets.GROQ_API_KEY }}
          NVIDIA_KEY: ${{ secrets.NVIDIA_API_KEY }}
          BRIDGE_URL: ${{ secrets.BRIDGE_URL }}
          BRIDGE_KEY: ${{ secrets.BRIDGE_KEY }}
          WP_PASS: ${{ secrets.WP_APP_PASS }}
        run: python scripts/init_swarm.py
